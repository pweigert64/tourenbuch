<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine Retrospective v45 - Portal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* --- GLOBAL & TYPO --- */
        body { font-family: 'Inter', sans-serif; }
        .noto-emoji { font-family: 'Noto Color Emoji', sans-serif; }

        /* --- LAYOUT --- */
        #main-layout { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
        
        /* SIDEBAR */
        #sidebar { 
            width: 240px; border-right: 1px solid #e5e7eb; background: white; 
            display: flex; flex-direction: column; z-index: 50;
        }
        .year-btn { 
            padding: 12px 24px; cursor: pointer; font-weight: 700; color: #64748b; 
            border-left: 4px solid transparent; transition: all 0.2s;
        }
        .year-btn:hover { background: #f8fafc; color: #4f46e5; }
        .year-btn.active { background: #eef2ff; color: #4f46e5; border-left-color: #4f46e5; }

        /* CONTENT AREA */
        #content-area { flex-grow: 1; position: relative; background: #f9fafb; display: flex; flex-direction: column; }
        
        /* TOP NAV */
        #top-nav { 
            height: 65px; border-bottom: 1px solid #e5e7eb; background: white; 
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
        }

        /* VIEWS */
        .view-container { flex-grow: 1; position: relative; overflow: hidden; }
        #portal-view { 
            position: absolute; inset: 0; overflow-y: auto; padding: 30px; 
            display: block; /* Default visible */
        }
        #map-view { position: absolute; inset: 0; display: none; }
        #map { width: 100%; height: 100%; }

        /* PORTAL CARDS */
        .grid-container { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 25px; max-width: 1400px; margin: 0 auto; 
        }
        .trip-card { 
            background: white; border-radius: 16px; overflow: hidden; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.06); transition: transform 0.3s ease;
        }
        .trip-card:hover { transform: translateY(-8px); }
        .trip-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        
        /* REUSE YOUR MARKER STYLES */
        .emoji-marker-outer { width: 26px!important; height: 26px!important; border-radius: 50%; border: 2px solid white; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .marker-ski { background: #4f46e5; } .marker-hike { background: #b54708; } .marker-climb { background: #dc2626; } 
        .marker-bike { background: #065f46; } .marker-bike-hike { background: #f97316; } .marker-trip { background: #9333ea; } 
        .emoji-marker-inner { font-size: 11pt; background: white; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }

        /* FLOATING MAP PANELS (Your original styles) */
        .floating-container { position: absolute; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
        .pop-out-panel { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); min-width: 240px; display: none; flex-direction: column; gap: 10px; border: 1px solid #e5e7eb; max-height: 42dvh; overflow-y: auto; }
        .circle-toggle { background: #4f46e5; color: white; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; border: 3px solid white; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div id="main-layout">
    <aside id="sidebar">
        <div class="p-6 border-b flex items-center gap-3">
            <span class="noto-emoji text-3xl">🏔️</span>
            <span class="font-black text-gray-800 tracking-tighter">RETRO</span>
        </div>
        <div id="sidebar-years" class="flex-grow overflow-y-auto pt-4">
            </div>
    </aside>

    <div id="content-area">
        <nav id="top-nav">
            <div id="current-title" class="text-xl font-extrabold text-indigo-900 uppercase tracking-widest">Wird geladen...</div>
            <div class="flex gap-2 bg-gray-100 p-1.5 rounded-2xl">
                <button id="view-portal-btn" onclick="switchView('portal')" class="p-2 px-5 rounded-xl transition-all text-xl bg-white shadow-sm">🗓️</button>
                <button id="view-map-btn" onclick="switchView('map')" class="p-2 px-5 rounded-xl transition-all text-xl opacity-50">🌍</button>
            </div>
        </nav>

        <div class="view-container">
            <section id="portal-view">
                <div id="album-grid" class="grid-container"></div>
            </section>

            <section id="map-view">
                <div id="map"></div>
                <div id="map-settings-group" class="floating-container" style="top: 15px; right: 15px;">
                    <button class="circle-toggle" onclick="togglePanel('map-panel')">🗺️</button>
                    <div id="map-panel" class="pop-out-panel">
                        <div class="bg-indigo-50 p-3 rounded-lg flex flex-col gap-2 text-[10px] font-bold">
                            <div class="flex justify-between border-b border-indigo-200 pb-1">
                                <span class="text-indigo-600 uppercase">Zoom</span>
                                <span id="zoom-level-display">11</span>
                            </div>
                            <input type="range" id="threshold-slider" min="1" max="17" value="16" step="1" class="w-full cursor-pointer">
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>

<script>
    /* --- CONFIG & STATE --- */
    const ASSET_BASE = 'https://raw.githubusercontent.com/pweigert64/tourenbuch/main';
    const COLORS = { 'ski': '#4f46e5', 'hike': '#b54708', 'climb': '#dc2626', 'bike': '#065f46', 'bike+hike': '#f97316', 'trip': '#9333ea', 'unknown': '#6b7280' };
    const ICONS_MAP = { 'ski': '❄️', 'hike': '🥾', 'climb': '⛰️', 'bike': '🚴', 'bike+hike': '🚵', 'trip': '🏛️' };

    let map, photoMarkers = [], currentMarkers = [], loadedTracks = {}, allMarkers = [];
    let activeFilters = { ski: true, hike: true, climb: true, bike: true, 'bike+hike': true, 'trip': true, 'unknown': true };
    let activeYear = 'All', currentView = 'portal', switchThreshold = 16;
    let MAPTILER_KEY, SHEETS_CSV_URL;

    /* --- LOAD LOGIC --- */
    async function init() {
        try {
            await loadConfig();
            await fetchSheetData();
        } catch (e) { console.error("Init Error:", e); }
    }

    async function loadConfig() {
        const response = await fetch(`${ASSET_BASE}/config.js?t=${Date.now()}`);
        const text = await response.text();
        MAPTILER_KEY = text.match(/MAPTILER_KEY\s*=\s*['"]([^'"]+)['"]/)[1];
        SHEETS_CSV_URL = text.match(/SHEETS_CSV_URL\s*=\s*['"]([^'"]+)['"]/)[1];
    }

    async function fetchSheetData() {
        const response = await fetch(`${SHEETS_CSV_URL}&t=${Date.now()}`);
        const csvText = await response.text();
        const lines = csvText.split(/\r?\n/);
        const headers = lines[0].split(',').map(h => h.trim().toLowerCase());

        photoMarkers = lines.slice(1).filter(l => l.trim() !== "").map(line => {
            const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            const obj = {};
            headers.forEach((h, i) => {
                let val = values[i] ? values[i].replace(/^"|"$/g, '').trim() : "";
                if (h === 'lat' || h === 'lon') val = parseFloat(val);
                obj[h] = val;
            });
            return obj;
        });

        // 1. Build Years
        buildYearSidebar();
        
        // 2. Init Map in background
        initMap();

        // 3. Set Default: Latest Year + Portal
        const latestYear = [...new Set(photoMarkers.map(p => p.year))].sort().reverse()[0];
        selectYear(latestYear);
    }

    function buildYearSidebar() {
        const container = document.getElementById('sidebar-years');
        const yrs = ['All', ...new Set(photoMarkers.map(p => p.year.toString()))].sort().reverse();
        container.innerHTML = yrs.map(y => `<div class="year-btn" id="btn-yr-${y}" onclick="selectYear('${y}')">${y}</div>`).join('');
    }

    function selectYear(yr) {
        activeYear = yr;
        document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-yr-${yr}`).classList.add('active');
        document.getElementById('current-title').innerText = yr === 'All' ? 'Gesamte Historie' : `Expeditionen ${yr}`;
        
        renderPortal();
        renderMarkers(); // Always sync map markers
    }

    function switchView(view) {
        currentView = view;
        document.getElementById('portal-view').style.display = view === 'portal' ? 'block' : 'none';
        document.getElementById('map-view').style.display = view === 'map' ? 'block' : 'none';
        
        document.getElementById('view-portal-btn').classList.toggle('bg-white', view === 'portal');
        document.getElementById('view-portal-btn').classList.toggle('opacity-50', view !== 'portal');
        document.getElementById('view-map-btn').classList.toggle('bg-white', view === 'map');
        document.getElementById('view-map-btn').classList.toggle('opacity-50', view !== 'map');

        if (view === 'map') setTimeout(() => map.invalidateSize(), 200);
    }

    /* --- PORTAL RENDER (New) --- */
    function renderPortal() {
        const grid = document.getElementById('album-grid');
        grid.innerHTML = '';
        const seenAlbums = new Set();

        const filtered = photoMarkers.filter(p => activeYear === 'All' || p.year.toString() === activeYear);

        filtered.forEach((p, idx) => {
            if (!seenAlbums.has(p.album)) {
                seenAlbums.add(p.album);
                const activityIcon = ICONS_MAP[p.activity?.toLowerCase().trim()] || '❓';
                const imgUrl = (p.img && p.img.length > 4) ? `${ASSET_BASE}/${p.year}/img/${p.img}` : '';

                grid.innerHTML += `
                    <article class="trip-card">
                        <img src="${imgUrl}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x225?text=Kein+Bild'">
                        <div class="p-5">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-gray-900 leading-tight">${p.title}</h3>
                                <span class="text-xl">${activityIcon}</span>
                            </div>
                            <p class="text-[10px] text-gray-400 font-bold uppercase mb-4">${p.date} • ${p.tags || ''}</p>
                            <div class="flex gap-2">
                                <a href="${p.album}" target="_blank" class="flex-1 bg-indigo-50 text-indigo-700 text-center py-2 rounded-lg font-bold text-xs">📸 Album</a>
                                <button onclick="jumpToMap(${photoMarkers.indexOf(p)})" class="flex-1 bg-gray-900 text-white py-2 rounded-lg font-bold text-xs">🌍 Karte</button>
                            </div>
                        </div>
                    </article>
                `;
            }
        });
    }

    function jumpToMap(idx) {
        switchView('map');
        const p = photoMarkers[idx];
        map.flyTo([p.lat, p.lon], 14);
        // Find marker in currentMarkers array by custom property
        const m = currentMarkers.find(m => m._idx === idx);
        if (m) setTimeout(() => m.openPopup(), 1000);
    }

    /* --- MAP LOGIC (Your Original Scripts Integrated) --- */
    function initMap() {
        map = L.map('map', { center: [48.18, 14.17], zoom: 11, zoomControl: false });
        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png').addTo(map);
        
        map.on('zoomend', () => {
            document.getElementById('zoom-level-display').innerText = map.getZoom();
        });
    }

    function renderMarkers() {
        if (!map) return;
        currentMarkers.forEach(m => map.removeLayer(m));
        currentMarkers = [];

        photoMarkers.forEach((p, i) => {
            const rawAct = p.activity?.toLowerCase().trim();
            const activityKey = ICONS_MAP[rawAct] ? rawAct : 'unknown';
            const yearMatch = (activeYear === 'All' || p.year.toString() === activeYear);

            if (yearMatch && p.lat && p.lon) {
                const icon = L.divIcon({
                    className: `emoji-marker-outer marker-${activityKey.replace('+', '-')}`,
                    html: `<span class="emoji-marker-inner">${ICONS_MAP[rawAct] || '❓'}</span>`,
                    iconSize: [26, 26]
                });

                const content = `<div class="text-center font-bold text-xs">${p.title}</div>`;
                const m = L.marker([p.lat, p.lon], { icon }).bindPopup(content).addTo(map);
                m._idx = i;
                currentMarkers.push(m);
            }
        });
    }

    function togglePanel(id) {
        const p = document.getElementById(id);
        p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
    }

    window.onload = init;
</script>
</body>
</html>
