<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine Retrospective v45 - Hybrid Edition</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
    
    <style>
        /* RESET & BASE */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; }
        .noto { font-family: 'Noto Color Emoji', sans-serif; }

        /* LAYOUT */
        #main-layout { display: flex; height: 100vh; width: 100vw; }
        
        /* SIDEBAR */
        #sidebar { width: 240px; background: white; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; z-index: 10001; }
        .year-item { padding: 12px 24px; cursor: pointer; font-weight: 700; color: #64748b; border-left: 4px solid transparent; transition: 0.2s; }
        .year-item:hover { background: #f8fafc; color: #4f46e5; }
        .year-item.active { background: #eef2ff; color: #4f46e5; border-left-color: #4f46e5; }

        /* CONTENT AREA */
        #content-area { flex-grow: 1; display: flex; flex-direction: column; position: relative; }
        #top-nav { height: 60px; background: white; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 10000; }
        
        /* VIEWS */
        #portal-view { position: absolute; inset: 60px 0 0 0; overflow-y: auto; padding: 25px; background: #f3f4f6; }
        #map-view { position: absolute; inset: 60px 0 0 0; display: none; }
        #map { width: 100%; height: 100%; }

        /* ORIGINAL FLOATING CONTROLS */
        .floating-container { position: absolute; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
        .pop-out-panel { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); min-width: 240px; display: none; flex-direction: column; gap: 10px; border: 1px solid #e5e7eb; max-height: 42dvh; overflow-y: auto; }
        .circle-toggle { background: #4f46e5; color: white; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; border: 3px solid white; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .filter-button { padding: 8px; font-size: 0.75rem; font-weight: 700; border-radius: 8px; cursor: pointer; border: 1px solid #d1d5db; text-align: center; width: 100%; }
        .filter-button-active { background: #4f46e5 !important; color: white !important; }

        /* MARKER & POPUP STYLES (RETAINED) */
        .photo-popup-img { width: 100%; border-radius: 0.4rem; object-fit: cover; height: 120px; margin-bottom: 5px; }
        .hover-title { background: rgba(0, 0, 0, 0.8) !important; color: white !important; border: none !important; border-radius: 4px; padding: 4px 8px; font-size: 13px; }
        .emoji-marker-outer { width: 26px!important; height: 26px!important; border-radius: 50%; border: 2px solid white; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .marker-ski { background: #4f46e5; } .marker-hike { background: #b54708; } .marker-climb { background: #dc2626; } .marker-bike { background: #065f46; } .marker-bike-hike { background: #f97316; } .marker-trip { background: #9333ea; }
        .emoji-marker-inner { font-size: 11pt; background: white; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
        .track-label { background: rgba(255, 255, 255, 0.9); border: 1px solid #999; padding: 1px 5px; font-weight: bold; border-radius: 4px; font-size: 10px; color: #333; }
    </style>
</head>
<body>

<div id="main-layout">
    <aside id="sidebar">
        <div class="p-5 border-b flex items-center gap-2">
            <span class="noto text-2xl">🏔️</span>
            <span class="font-black tracking-tighter text-gray-800">RETROSPECTIVE</span>
        </div>
        <div id="year-menu" class="flex-grow overflow-y-auto pt-2"></div>
    </aside>

    <div id="content-area">
        <header id="top-nav">
            <div id="view-title" class="font-black text-indigo-600 uppercase tracking-widest">Portal</div>
            <div class="flex gap-2 bg-gray-100 p-1 rounded-xl">
                <button id="btn-portal" onclick="switchView('portal')" class="px-5 py-2 rounded-lg bg-white shadow-sm transition-all">🗓️</button>
                <button id="btn-map" onclick="switchView('map')" class="px-5 py-2 rounded-lg opacity-50 transition-all">🌍</button>
            </div>
        </header>

        <section id="portal-view">
            <div id="portal-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 max-w-7xl mx-auto"></div>
        </section>

        <section id="map-view">
            <div id="map"></div>
            
            <div id="activity-settings-group" class="floating-container" style="bottom: 20px; right: 15px;">
                <div id="activity-panel" class="pop-out-panel">
                    <div class="text-[10px] font-bold text-gray-400 uppercase">Activity Filter:</div>
                    <div class="grid grid-cols-6 gap-0.5 mb-2">
                        <button class="filter-button filter-button-active p-1 text-base noto" data-activity="ski">❄️</button>
                        <button class="filter-button filter-button-active p-1 text-base noto" data-activity="hike">🥾</button>
                        <button class="filter-button filter-button-active p-1 text-base noto" data-activity="climb">⛰️</button>
                        <button class="filter-button filter-button-active p-1 text-base noto" data-activity="bike">🚴</button>
                        <button class="filter-button filter-button-active p-1 text-base noto" data-activity="bike+hike">🚵</button>
                        <button class="filter-button filter-button-active p-1 text-base noto" data-activity="trip">🏛️</button>
                    </div>
                    
                    <input type="text" id="power-search" placeholder="title:<>,tags:..." onkeydown="if(event.key === 'Enter') handleDeepLink()" class="w-full bg-gray-800 text-white p-2 rounded text-[10px] mb-2">
                    
                    <div class="grid grid-cols-2 gap-1.5">
                        <button class="bg-emerald-600 text-white p-2 rounded text-[10px] font-bold" onclick="showAllTracks()">🗺️ ALL TRACKS</button>
                        <button id="clear-tracks-btn" class="bg-gray-300 text-white p-2 rounded text-[10px] font-bold cursor-not-allowed" onclick="clearAllTracks()">🗑️ CLEAR</button>
                    </div>
                </div>
                <button class="circle-toggle" onclick="togglePanel('activity-panel')">⚙️</button>
            </div>

            <div id="map-settings-group" class="floating-container" style="top: 15px; right: 15px;">
                <button class="circle-toggle" onclick="togglePanel('map-panel')">🗺️</button>
                <div id="map-panel" class="pop-out-panel">
                    <div class="bg-indigo-50 p-3 rounded-lg flex flex-col gap-2 text-[10px] font-bold">
                        <div class="flex justify-between border-b border-indigo-200 pb-1">
                            <span class="text-indigo-600 uppercase">Zoom</span>
                            <span id="zoom-level-display">11</span>
                        </div>
                        <div class="flex justify-between">
                            <span>SWITCH AT:</span>
                            <span id="threshold-display">16</span>
                        </div>
                        <input type="range" id="threshold-slider" min="1" max="17" value="16" step="1" class="w-full cursor-pointer">
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>

<script>
    /* --- CONFIG & STATE (RETAINED) --- */
    const ASSET_BASE = 'https://raw.githubusercontent.com/pweigert64/tourenbuch/main';
    const COLORS = { 'ski': '#4f46e5', 'hike': '#b54708', 'climb': '#dc2626', 'bike': '#065f46', 'bike+hike': '#f97316', 'trip': '#9333ea', 'unknown': '#6b7280' };
    const ICONS_MAP = { 'ski': '❄️', 'hike': '🥾', 'climb': '⛰️', 'bike': '🚴', 'bike+hike': '🚵', 'trip': '🏛️' };

    let map, overviewLayer, detailLayer;
    let photoMarkers = [], currentMarkers = [], loadedTracks = {};
    let activeFilters = { ski: true, hike: true, climb: true, bike: true, 'bike+hike': true, 'trip': true, 'unknown': true };
    let activeYear = 'All', switchThreshold = 16, MAPTILER_KEY, SHEETS_CSV_URL;

    async function init() {
        await loadConfig();
        await fetchSheetData();
        setupEvents();
    }

    async function loadConfig() {
        const response = await fetch(`${ASSET_BASE}/config.js?t=${Date.now()}`);
        const text = await response.text();
        MAPTILER_KEY = text.match(/MAPTILER_KEY\s*=\s*['"]([^'"]+)['"]/)[1];
        SHEETS_CSV_URL = text.match(/SHEETS_CSV_URL\s*=\s*['"]([^'"]+)['"]/)[1];
    }

    async function fetchSheetData() {
        const response = await fetch(`${SHEETS_CSV_URL}&t=${Date.now()}`);
        const csvText = await response.text();
        const lines = csvText.split(/\r?\n/);
        const headers = lines[0].split(',').map(h => h.trim().toLowerCase());

        photoMarkers = lines.slice(1).filter(l => l.trim() !== "").map(line => {
            const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            const obj = {};
            headers.forEach((h, i) => {
                let val = values[i] ? values[i].replace(/^"|"$/g, '').trim() : "";
                if (h === 'lat' || h === 'lon') val = parseFloat(val);
                obj[h] = val;
            });
            return obj;
        });

        const yrs = ['All', ...new Set(photoMarkers.map(p => p.year.toString()))].sort().reverse();
        document.getElementById('year-menu').innerHTML = yrs.map(y => `<div class="year-item" id="yr-${y}" onclick="selectYear('${y}')">${y}</div>`).join('');
        
        initMap();
        selectYear(yrs[1]); // Select latest real year by default
    }

    function selectYear(yr) {
        activeYear = yr;
        document.querySelectorAll('.year-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`yr-${yr}`).classList.add('active');
        renderPortal();
        renderMarkers();
    }

    function switchView(v) {
        document.getElementById('portal-view').style.display = v === 'portal' ? 'block' : 'none';
        document.getElementById('map-view').style.display = v === 'map' ? 'block' : 'none';
        document.getElementById('view-title').innerText = v === 'portal' ? 'Portal' : 'World Map';
        document.getElementById('btn-portal').classList.toggle('opacity-50', v !== 'portal');
        document.getElementById('btn-map').classList.toggle('opacity-50', v !== 'map');
        if(v === 'map') setTimeout(() => map.invalidateSize(), 200);
    }

    /* --- PORTAL RENDER --- */
    function renderPortal() {
        const grid = document.getElementById('portal-grid');
        grid.innerHTML = '';
        const filtered = photoMarkers.filter(p => activeYear === 'All' || p.year.toString() === activeYear);
        
        filtered.forEach((p, idx) => {
            const img = (p.img && p.img.length > 4) ? `${ASSET_BASE}/${p.year}/img/${p.img}` : '';
            grid.innerHTML += `
                <div class="bg-white rounded-xl overflow-hidden shadow-sm hover:translate-y-[-4px] transition-all">
                    <img src="${img}" loading="lazy" class="w-full aspect-video object-cover" onerror="this.src='https://via.
