<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alpine Retrospektive</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <style>
        :root {
            --sidebar-width: 260px;
            --top-height: 70px;
            --bg-color: #f4f7f6;
            --accent: #3498db;
            --text-main: #2c3e50;
        }

        body, html { margin: 0; padding: 0; font-family: 'Inter', sans-serif; height: 100vh; background: var(--bg-color); color: var(--text-main); overflow: hidden; }

        /* --- Sidebar --- */
        #sidebar {
            position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-width);
            background: #ffffff; border-right: 1px solid #e0e0e0; z-index: 1000;
            display: flex; flex-direction: column; transition: transform 0.3s ease;
        }

        .brand {
            padding: 20px; display: flex; align-items: center; gap: 10px;
            font-weight: 800; font-size: 1.1rem; border-bottom: 1px solid #eee;
        }

        .mountain-emoji { font-family: 'Noto Color Emoji', sans-serif; font-size: 2.2rem; }

        #year-list { list-style: none; padding: 10px 0; margin: 0; overflow-y: auto; flex-grow: 1; }
        #year-list li {
            padding: 12px 25px; cursor: pointer; transition: 0.2s; font-weight: 600; color: #7f8c8d;
        }
        #year-list li:hover { color: var(--accent); background: #f9f9f9; }
        #year-list li.active { color: var(--accent); background: #eef7ff; border-left: 5px solid var(--accent); }

        /* --- Top Bar --- */
        #top-bar {
            position: fixed; left: var(--sidebar-width); right: 0; height: var(--top-height);
            background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid #e0e0e0; z-index: 900;
            display: flex; align-items: center; justify-content: space-between; padding: 0 25px;
        }

        #current-selection { font-size: 1.3rem; font-weight: 700; }

        .view-switcher { display: flex; gap: 5px; background: #eee; padding: 5px; border-radius: 12px; }
        .view-btn {
            background: none; border: none; font-size: 1.5rem; cursor: pointer;
            padding: 5px 15px; border-radius: 8px; transition: 0.2s;
        }
        .view-btn.active { background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* --- Content --- */
        .content { margin-left: var(--sidebar-width); padding-top: var(--top-height); height: calc(100vh - var(--top-height)); position: relative; }
        #map-view, #portal-view { position: absolute; width: 100%; height: 100%; display: none; }
        #portal-view { overflow-y: auto; padding: 30px; box-sizing: border-box; }

        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px; max-width: 1400px; margin: 0 auto;
        }

        .card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #ddd; }
        .card-body { padding: 20px; }
        .card-body h3 { margin: 0 0 10px 0; font-size: 1.1rem; }
        .card-tags { font-size: 0.8rem; color: #95a5a6; margin-bottom: 15px; }

        .card-actions { display: flex; gap: 10px; }
        .card-actions a, .card-actions button {
            flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; 
            text-decoration: none; text-align: center; font-weight: 700; font-size: 0.85rem;
        }
        .btn-map { background: #e8f5e9; color: #2e7d32; }
        .btn-photos { background: #e3f2fd; color: #1565c0; }

        @media (max-width: 1024px) {
            #sidebar { transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
            #top-bar, .content { left: 0; margin-left: 0; }
        }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="brand">
        <span class="mountain-emoji">🏔️</span>
        <span>alpine Retrospektive</span>
    </div>
    <ul id="year-list"></ul>
</div>

<div id="top-bar">
    <div id="current-selection">Lade Abenteuer...</div>
    <div class="view-switcher">
        <button id="btn-portal" class="view-btn active" onclick="switchView('portal')">🗓️</button>
        <button id="btn-map" class="view-btn" onclick="switchView('map')">🌍</button>
    </div>
</div>

<div class="content">
    <div id="map-view"><div id="map" style="height: 100%;"></div></div>
    <div id="portal-view"><div class="grid" id="album-grid"></div></div>
</div>

<script>
    let allData = [];
    let map;
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR1jF7J6Z5u8hbOCka2VFlVSnughkNsAdCfdvigbW4ioJaM1rkMgxxz8FW38Jhq7q32kq23EhFMUOPa/pub?gid=0&single=true&output=csv";

    function init() {
        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            complete: function(results) {
                // Filtere nur Zeilen mit Album-Link
                allData = results.data.filter(r => Object.values(r).some(val => val.includes('http')));
                
                if(allData.length === 0) {
                    document.getElementById('current-selection').innerText = "Keine Daten gefunden.";
                    return;
                }

                setupNavigation();
                initMap();
                
                // Nimm das neueste Jahr aus der Spalte 'date'
                const years = [...new Set(allData.map(r => r.date ? r.date.split('.')[2] : null))].filter(y => y).sort().reverse();
                selectYear(years[0] || 'ALL');
                switchView('portal');
            }
        });
    }

    function setupNavigation() {
        const list = document.getElementById('year-list');
        const years = [...new Set(allData.map(r => r.date ? r.date.split('.')[2] : null))].filter(y => y).sort().reverse();
        
        let html = `<li id="yr-ALL" onclick="selectYear('ALL')">ALL</li>`;
        years.forEach(y => html += `<li id="yr-${y}" onclick="selectYear('${y}')">${y}</li>`);
        list.innerHTML = html;
    }

    function selectYear(yr) {
        document.querySelectorAll('#year-list li').forEach(li => li.classList.remove('active'));
        const activeLi = document.getElementById(`yr-${yr}`);
        if(activeLi) activeLi.classList.add('active');
        
        document.getElementById('current-selection').innerText = yr === 'ALL' ? 'Alle Abenteuer' : yr;
        renderPortal(yr);
    }

    function switchView(v) {
        document.getElementById('portal-view').style.display = v === 'portal' ? 'block' : 'none';
        document.getElementById('map-view').style.display = v === 'map' ? 'block' : 'none';
        document.getElementById('btn-portal').classList.toggle('active', v === 'portal');
        document.getElementById('btn-map').classList.toggle('active', v === 'map');
        if(v === 'map' && map) setTimeout(() => map.invalidateSize(), 100);
    }

    function renderPortal(yearFilter) {
        const grid = document.getElementById('album-grid');
        grid.innerHTML = '';
        const seen = new Set();

        allData.forEach(row => {
            const yr = row.date ? row.date.split('.')[2] : null;
            if(yearFilter !== 'ALL' && yr !== yearFilter) return;

            if(!seen.has(row.album)) {
                seen.add(row.album);
                grid.innerHTML += `
                    <div class="card">
                        <img src="${row.img}" onerror="this.src='https://via.placeholder.com/400x225?text=Kein+Bild'">
                        <div class="card-body">
                            <h3>${row.title}</h3>
                            <div class="card-tags">${row.tags || ''}</div>
                            <div class="card-actions">
                                <button class="btn-map" onclick="switchView('map')">🌍 Karte</button>
                                <a href="${row.album}" target="_blank" class="btn-photos">🗓️ Album</a>
                            </div>
                        </div>
                    </div>`;
            }
        });
    }

    function initMap() {
        map = L.map('map').setView([47.0, 12.0], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM' }).addTo(map);
    }

    window.onload = init;
</script>
</body>
</html>
