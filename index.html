<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine Retrospective Map v45</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylinedecorator.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
	<style>
		/* RESET: Makes sure the map fills the whole browser window */
		html, body, #map-container { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
		#map { width: 100%; height: 100dvh; background: #f3f4f6; }

		/* SHARED FLOATING LAYOUT: Used for both Top and Bottom groups */
		.floating-container { 
			position: absolute; 
			z-index: 9999; 
			display: flex; 
			flex-direction: column; 
			align-items: flex-end; 
			gap: 10px; 
		}

		/* THE POP-OUT PANELS: Unified style for both Map and Activity menus */
		.pop-out-panel { 
			background: white; 
			padding: 15px; 
			border-radius: 12px; 
			box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
			min-width: 240px; 
			display: none; /* Toggled via JS to 'flex' */
			flex-direction: column; 
			gap: 10px; 
			border: 1px solid #e5e7eb; 
			
			/* LANDSCAPE OPTIMIZATION */
			max-height: 42dvh;    /* Prevents the panel from ever being taller than half the screen */
			overflow-y: auto;     /* Adds a scrollbar if the menu is too tall */
			-webkit-overflow-scrolling: touch; 
		}

		/* THE CIRCLE BUTTONS (Map Icon and Gear Icon) */
		.circle-toggle { 
			background: #4f46e5; 
			color: white; 
			width: 50px; 
			height: 50px; 
			border-radius: 50%; 
			cursor: pointer; 
			border: 3px solid white; 
			font-size: 1.5rem; 
			display: flex; 
			align-items: center; 
			justify-content: center; 
			box-shadow: 0 4px 10px rgba(0,0,0,0.2);
		}

		/* INTERNAL ELEMENTS */
		#zoom-level-display {
			background: #f3f4f6; color: #374151;
			padding: 2px 6px; border-radius: 4px;
			font-family: monospace; font-weight: bold;
		}
		
		#year-select {
			cursor: pointer;
			border: 1px solid #d1d5db;
			outline: none;
		}
		#year-select:focus {
			border-color: #4f46e5;
		}

		.filter-button { 
			padding: 8px; font-size: 0.75rem; font-weight: 700; border-radius: 8px;
			cursor: pointer; border: 1px solid #d1d5db; text-align: center; width: 100%; 
		}
		.filter-button-active { background: #4f46e5 !important; color: white !important; }

		/* Marker Styles */
		.emoji-marker-outer { width: 26px!important; height: 26px!important; border-radius: 50%; border: 2px solid white; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
		.marker-ski { background: #4f46e5; } 
		.marker-hike { background: #b54708; } 
		.marker-climb { background: #dc2626; } 
		.marker-bike { background: #065f46; } 
		.marker-bike-hike { background: #f97316; }
		.marker-trip { background: #9333ea; } 
		.marker-unknown { background: #6b7280; } 
		
		.emoji-marker-inner { font-size: 11pt; background: white; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
		
		/* Activities Popup & Title Styling */
		.leaflet-popup-content { width: 200px !important; margin: 10px; }
		.popup-title { 
			font-size: 10px; line-height: 1.3; margin: 5px 0; font-weight: bold;
			display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
			overflow: hidden; text-overflow: ellipsis; text-align: center;
		}
		.photo-popup-img { width: 100%; border-radius: 0.4rem; object-fit: cover; height: 120px; margin-bottom: 5px; }
		
		.track-label { 
			background: rgba(255, 255, 255, 0.9); border: 1px solid #999; padding: 1px 5px; 
			font-weight: bold; border-radius: 4px; font-size: 10px; color: #333; 
			box-shadow: 2px 2px 5px rgba(0,0,0,0.1); white-space: nowrap;
		}
		
		/* Styling for the Hover Tooltip */
		.hover-title {
			background: rgba(0, 0, 0, 0.8) !important;
			color: white !important;
			border: none !important;
			border-radius: 4px;
			padding: 4px 8px;
			font-size: 13px;
		}

		/* This styles the arrow to match the black background */
		.leaflet-tooltip-top.hover-title:before {
			border-top-color: rgba(0, 0, 0, 0.8);
		}
		.leaflet-tooltip-right:before, .leaflet-tooltip-left:before { display: none; }
	</style>
</head>
<body>

<div id="map-container">
	<div id="map-settings-group" class="floating-container" style="top: 65px; right: 15px;">
		<button class="circle-toggle" onclick="togglePanel('map-panel')">🗺️</button>
		<div id="map-panel" class="pop-out-panel">
			<div class="bg-indigo-50 p-3 rounded-lg flex flex-col gap-2 text-[10px] font-bold">
				<div class="flex justify-between border-b border-indigo-200 pb-1">
					<span class="text-indigo-600 uppercase">Zoom</span>
					<span id="zoom-level-display">11</span>
				</div>
				<div class="flex justify-between">
					<span>SWITCH AT:</span>
					<span id="threshold-display">16</span>
				</div>
				<input type="range" id="threshold-slider" min="1" max="17" value="16" step="1" class="w-full cursor-pointer">
			</div>
			<div class="grid grid-cols-2 gap-2 mt-1">
				<button id="hike-layer-btn" class="filter-button border text-[9px] py-2 bg-white">🏔️ HIKE</button>
				<button id="bike-layer-btn" class="filter-button border text-[9px] py-2 bg-white">🚲 MTB</button>
			</div>
		</div>
	</div>

	<div id="activity-settings-group" class="floating-container" style="bottom: 40px; right: 15px;">
		<div id="activity-panel" class="pop-out-panel" style="margin-bottom: 8px; gap: 4px;">
			
			<div class="text-[10px] font-bold text-gray-400 uppercase mb-0.5">Activity Filter:</div>

			<div class="flex items-center justify-between gap-2 mb-1 bg-gray-50 p-1 rounded-md">
				<span class="text-[10px] font-bold text-gray-400 uppercase">Year:</span>
				<select id="year-select" class="w-24 text-sm p-0.5 border rounded font-bold bg-white"></select>
			</div>

			<div class="grid grid-cols-6 gap-0.5 mb-1">
				<button class="filter-button filter-button-active p-1 text-base" data-activity="ski">❄️</button>
				<button class="filter-button filter-button-active p-1 text-base" data-activity="hike">🥾</button>
				<button class="filter-button filter-button-active p-1 text-base" data-activity="climb">⛰️</button>
				<button class="filter-button filter-button-active p-1 text-base" data-activity="bike">🚴</button>
				<button class="filter-button filter-button-active p-1 text-base" data-activity="bike+hike">🚵</button>
				<button class="filter-button filter-button-active p-1 text-base" data-activity="trip">🏛️</button>
			</div>
			
			<div class="pt-1 border-t border-gray-100">
				<div class="text-[10px] font-bold text-gray-400 uppercase mb-1">Track Control:</div>
				<div class="grid grid-cols-2 gap-1.5">
					<button id="show-all-tracks-btn" class="filter-button bg-emerald-600 text-white border-none" onclick="showAllTracks()">🗺️ ALL</button>
					<button id="clear-tracks-btn" class="filter-button bg-gray-300 text-white border-none cursor-not-allowed" onclick="clearAllTracks()">🗑️ CLR</button>
				</div>
			</div>

			<div class="mt-2 text-[9px] font-bold text-gray-300 border-t pt-2">
				<button onclick="reloadData()" class="hover:text-amber-500 transition-colors uppercase flex justify-between w-full">
					<span>🔄 Refresh Sheet Data</span>
					<span id="reload-status">IDLE</span>
				</button>
			</div>
		</div>
		<button class="circle-toggle" onclick="togglePanel('activity-panel')">⚙️</button>
	</div>
	
    <div id="map"></div>
</div>

<script>
    const ASSET_BASE = 'https://raw.githubusercontent.com/pweigert64/tourenbuch/main';
	//const ASSET_BASE = '.';
    const COLORS = { 
        'ski': '#4f46e5', 
        'hike': '#b54708', 
        'climb': '#dc2626', 
        'bike': '#065f46', 
        'bike+hike': '#f97316',
		'trip': '#9333ea',   // Purple
        'unknown': '#6b7280' 
    };
	// GLOBAL ICON MAP - The single source of truth
	const ICONS_MAP = { 
		'ski': '❄️', 'hike': '🥾', 'climb': '⛰️', 
		'bike': '🚴', 'bike+hike': '🚵', 'trip': '🏛️' 
	};

    let map, overviewLayer, detailLayer, hikingLayer, cyclingLayer;
    let photoMarkers = [], currentMarkers = [], loadedTracks = {}, activeLines = {}; 
    let activeFilters = { ski: true, hike: true, climb: true, bike: true, 'bike+hike': true, 'trip': true, 'unknown': true };
    let activeYear = 'All', isInitialLoad = true, switchThreshold = 16; 
    let MAPTILER_KEY, SHEETS_CSV_URL;

	/* -------------------------------------------------------------------------
	 * TOGGLE PANEL opens gear/map button.
	 --------------------------------------------------------------------------*/
	function togglePanel(panelId) {
		const target = document.getElementById(panelId);
		
		// Check current state
		const isCurrentlyVisible = target.style.display === 'flex';
		
		// 1. Hide ALL panels first so they don't overlap
		document.querySelectorAll('.pop-out-panel').forEach(p => {
			p.style.display = 'none';
		});
		
		// 2. If it was hidden, show it now
		if (!isCurrentlyVisible) {
			target.style.display = 'flex';
		}
	}

    async function loadConfig() {
        const response = await fetch(`${ASSET_BASE}/config.js?t=${new Date().getTime()}`);
        if (!response.ok) throw new Error("Could not find config.js on GitHub.");
        const text = await response.text();
        
        const keyMatch = text.match(/MAPTILER_KEY\s*=\s*['"]([^'"]+)['"]/);
        const urlMatch = text.match(/SHEETS_CSV_URL\s*=\s*['"]([^'"]+)['"]/);
        
        if (keyMatch && urlMatch) {
            MAPTILER_KEY = keyMatch[1];
            SHEETS_CSV_URL = urlMatch[1];
        } else {
            throw new Error("config.js exists but variables are unreadable.");
        }
    }

	/* -------------------------------------------------------------------------
	 * FETCH SHEET DATA: The core logic to get data from Google
	 --------------------------------------------------------------------------*/
	async function fetchSheetData() {
		try {
			if (!SHEETS_CSV_URL) await loadConfig(); 
			
			const response = await fetch(`${SHEETS_CSV_URL}&t=${new Date().getTime()}`);
			const csvText = await response.text();
			const lines = csvText.split(/\r?\n/);
			const headers = lines[0].split(',').map(h => h.trim().toLowerCase());

			photoMarkers = lines.slice(1).filter(l => l.trim() !== "").map(line => {
				const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
				const obj = {};
				headers.forEach((h, i) => {
					let val = values[i] ? values[i].replace(/^"|"$/g, '').trim() : "";
					if (h === 'lat' || h === 'lon') val = parseFloat(val);
					obj[h] = val;
				});
				return obj;
			});

			if (!map) {
				initMap();
			} else {
				populateYearDropdown();
				renderMarkers();
			}
			
			return true; // <--- This tells reloadData "I am done!"
		} catch (e) {
			console.error("Fetch Error:", e);
			return false; // <--- This tells reloadData "Something went wrong"
		}
	}

	/* -------------------------------------------------------------------------
	 * INITIAL DATA FETCH: Only called once on page load
	 --------------------------------------------------------------------------*/
	async function initDataFetch() {
		await fetchSheetData();
	}

	/* -------------------------------------------------------------------------
	 * RELOAD DATA: Triggered by the button
	 --------------------------------------------------------------------------*/
	window.reloadData = function() {
		// 1. Get the status label from the bottom of your panel
		const status = document.getElementById('reload-status');
		if (status) {
			status.innerText = "LOADING...";
			status.style.color = "#f59e0b"; // Orange
		}

		// 2. Wipe the current map state
		// We remove the markers manually since we aren't using a cluster group yet
		currentMarkers.forEach(m => map.removeLayer(m));
		currentMarkers = [];
		
		// Clear the tracks using your existing function
		clearAllTracks();
		
		// Empty the data array
		photoMarkers = []; 

		// 3. Trigger the fetch and handle the result
		fetchSheetData().then((success) => {
			if (status) {
				if (success) {
					status.innerText = "DONE!";
					status.style.color = "#10b981"; // Green
				} else {
					status.innerText = "ERROR";
					status.style.color = "#ef4444"; // Red
				}
				
				// Reset to idle after 3 seconds
				setTimeout(() => { 
					status.innerText = "IDLE"; 
					status.style.color = ""; 
				}, 3000);
			}
		});
	};

    function initMap() {
        const startPos = [photoMarkers[0].lat, photoMarkers[0].lon];
        map = L.map('map', { center: startPos, zoom: 11, zoomControl: false });
        
        overviewLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17 }).addTo(map);
        detailLayer = L.tileLayer(`https://api.maptiler.com/maps/outdoor-v4/{z}/{x}/{y}@2x.png?key=${MAPTILER_KEY}`, { tileSize: 512, zoomOffset: -1, maxZoom: 19 });
        
        hikingLayer = L.tileLayer('https://tile.waymarkedtrails.org/hiking/{z}/{x}/{y}.png');
        cyclingLayer = L.tileLayer('https://tile.waymarkedtrails.org/mtb/{z}/{x}/{y}.png');

        map.on('zoomend', () => {
			const currentZoom = map.getZoom();
				
			// Update the Zoom number inside of gear wheel panel
			const zDisp = document.getElementById('zoom-level-display');
			if (zDisp) zDisp.innerText = currentZoom;
				
            if (currentZoom >= switchThreshold) {
                if (!map.hasLayer(detailLayer)) { 
                    detailLayer.addTo(map); 
                    map.removeLayer(overviewLayer); 
                    hikingLayer.bringToFront();
                    cyclingLayer.bringToFront();
                }
            } else {
                if (!map.hasLayer(overviewLayer)) { 
                    overviewLayer.addTo(map); 
                    map.removeLayer(detailLayer); 
                    hikingLayer.bringToFront();
                    cyclingLayer.bringToFront();
                }
            }
        });

        L.control.zoom({ position: 'bottomleft' }).addTo(map);
        setupEvents();
        populateYearDropdown();
        renderMarkers();
    }

	/* -------------------------------------------------------------------------
	 * SETUP EVENTS assigns the handlefunctions to the defined events.
	 --------------------------------------------------------------------------*/
    function setupEvents() {
		document.querySelectorAll('[data-activity]').forEach(btn => {
				btn.onclick = () => {
					// 1. Get the key (e.g., 'trip') from the button
					const activityKey = btn.dataset.activity; 
					
					// 2. Toggle the true/false value in our Global State
					activeFilters[activityKey] = !activeFilters[activityKey];
					
					// 3. Update the button's look (Purple if active, Gray if not)
					btn.classList.toggle('filter-button-active', activeFilters[activityKey]);
					
					// 4. Refresh the map to show/hide the markers
					renderMarkers();
				};
			});
        document.getElementById('hike-layer-btn').onclick = function() {
            map.hasLayer(hikingLayer) ? map.removeLayer(hikingLayer) : hikingLayer.addTo(map);
            this.classList.toggle('filter-button-active');
        };
        document.getElementById('bike-layer-btn').onclick = function() {
            map.hasLayer(cyclingLayer) ? map.removeLayer(cyclingLayer) : cyclingLayer.addTo(map);
            this.classList.toggle('filter-button-active');
        };
        document.getElementById('threshold-slider').oninput = (e) => {
            switchThreshold = parseFloat(e.target.value);
            document.getElementById('threshold-display').innerText = switchThreshold;
        };
    }

    window.clearAllTracks = function() {
        Object.keys(loadedTracks).forEach(idx => {
            map.removeLayer(loadedTracks[idx].group);
        });
        loadedTracks = {};
        renderMarkers();
    };

	/* -------------------------------------------------------------------------
	 * LOAD GPX TRACK toggles tracks on and off. Optionally flying to bounds
	 --------------------------------------------------------------------------*/
	window.loadGpxTrack = function(idx, shouldZoom = true) {
		const p = photoMarkers[idx];
		const url = `${ASSET_BASE}/${p.year}/gpx/${p.gpx}`;
		const color = COLORS[ICONS_MAP.hasOwnProperty(p.activity?.toLowerCase().trim()) ? p.activity.toLowerCase().trim() : 'unknown'];

		map.closePopup();

		if (loadedTracks[idx]) {
			map.removeLayer(loadedTracks[idx].group);
			delete loadedTracks[idx];
			renderMarkers();
			return;
		}

		const trackGroup = L.featureGroup().addTo(map);
		const label = L.tooltip({ permanent: true, direction: 'right', offset: [15, 0], className: 'track-label' })
			.setContent(p.title).setLatLng([p.lat, p.lon]);
		trackGroup.addLayer(label);

		const trackLayer = new L.GPX(url, {
			async: true,
			marker_options: { startIconUrl: '', endIconUrl: '' },
			polyline_options: { color: color, weight: 5, opacity: 0.9, lineJoin: 'round' }
		}).on('loaded', e => {
			e.target.eachLayer(layer => {
				if (layer instanceof L.Polyline) {
					let dashPattern = p.activity === 'ski' ? '2, 12' : (p.activity === 'hike' || p.activity === 'climb' ? '10, 10' : '20, 5');
					L.polyline(layer.getLatLngs(), { color: '#FFFFFF', weight: 2, opacity: 0.8, dashArray: dashPattern, lineCap: 'round', interactive: false }).addTo(trackGroup);
				}
			});
			
			// IMMEDIATE MOVE: As soon as THIS specific track is ready
			if (shouldZoom) {
				const b = e.target.getBounds();
				if (b.isValid()) map.flyToBounds(b, { padding: [40, 40] });
				else map.flyTo([p.lat, p.lon], 15);
			}
			
			loadedTracks[idx] = { group: trackGroup, filename: p.gpx, layer: e.target };
			renderMarkers();
		}).on('error', () => {
			if (shouldZoom) map.flyTo([p.lat, p.lon], 15);
		});

		trackGroup.addLayer(trackLayer);
		return trackLayer;
	};
	
	/* -------------------------------------------------------------------------
	 * SHOW ALL TRACKS that are not already visible and match the active filters
	 * Function triggered by gear wheel button!
	 --------------------------------------------------------------------------*/
	window.showAllTracks = function() {
		let runningBounds = L.latLngBounds();
		let processedCount = 0;

		// 1. Identify all markers that match current filters AND have a GPX file
		const tracksToProcess = photoMarkers.filter((p) => {
			const rawAct = (p.activity) ? p.activity.toLowerCase().trim() : '';
			const activityKey = ICONS_MAP.hasOwnProperty(rawAct) ? rawAct : 'unknown';
			const yearMatch = (activeYear === 'All' || p.year.toString() === activeYear);
			const filterMatch = (activityKey === 'unknown') || activeFilters[activityKey];
			
			// --- THE NEPAL & TRIP FIX ---
			// Only zoom to things that actually have a track to show
			return yearMatch && filterMatch && p.gpx && p.gpx.length > 5;
		});

		if (tracksToProcess.length === 0) return;

		// 2. The Final Master Zoom check
		const finalizeMasterView = () => {
			processedCount++;
			if (processedCount === tracksToProcess.length && runningBounds.isValid()) {
				map.flyToBounds(runningBounds, { padding: [50, 50], duration: 1.5 });
			}
		};

		// 3. Process each track
		tracksToProcess.forEach((p) => {
			const idx = photoMarkers.indexOf(p);
			
			if (loadedTracks[idx]) {
				// Already there? Just add its bounds to the master box
				const b = loadedTracks[idx].group.getBounds();
				if (b.isValid()) runningBounds.extend(b);
				finalizeMasterView();
			} else {
				// New? Load it and extend view cumulatively
				const track = loadGpxTrack(idx, false); 
				track.on('loaded', e => {
					const gb = e.target.getBounds();
					if (gb.isValid()) {
						runningBounds.extend(gb);
						// Cumulative "stretching" move
						map.flyToBounds(runningBounds, { padding: [60, 60], duration: 0.8 });
					}
					finalizeMasterView();
				});
				track.on('error', () => finalizeMasterView());
			}
		});
	};
	
	/* -------------------------------------------------------------------------
	 * CLEAR ALL TRACKS that are visible
	 * Function triggered by gear wheel button!
	 --------------------------------------------------------------------------*/	
	window.clearAllTracks = function() {
		// Loop through all currently active track groups
		Object.keys(loadedTracks).forEach(idx => {
			// Use .group because that's where we stored the LayerGroup
			if (loadedTracks[idx] && loadedTracks[idx].group) {
				map.removeLayer(loadedTracks[idx].group);
			}
		});
		// Reset the tracking object so the map "forgets" what was loaded
		loadedTracks = {};
		// Refresh the UI/Markers
		renderMarkers();
	};

	/* -------------------------------------------------------------------------
	 * RENDER MARKERS on the map
	 * Function drows the activity markers on the map and handles the popUp
	 --------------------------------------------------------------------------*/	
	function renderMarkers() {
		let openId = null;
		// Clean up existing markers and check if we need the "Clear" button in the sidebar
		currentMarkers.forEach(m => { 
			if(m.getPopup().isOpen()) openId = m._idx; 
			map.removeLayer(m); 
		});
		currentMarkers = [];
		
		// cleanup existing Tracks
		Object.keys(loadedTracks).forEach(idx => {
			const p = photoMarkers[idx];
			const rawAct = (p.activity) ? p.activity.toLowerCase().trim() : '';
			const activityKey = ICONS_MAP.hasOwnProperty(rawAct) ? rawAct : 'unknown';
			
			// If the filter for this track is now OFF, remove the track
			if (!activeFilters[activityKey]) {
				map.removeLayer(loadedTracks[idx].group);
				delete loadedTracks[idx];
			}
		});
		
		// stable clear Button logic ---
		const clearBtn = document.getElementById('clear-tracks-btn');
		if (clearBtn) {
			const hasTracks = Object.keys(loadedTracks).length > 0;
			
			if (hasTracks) {
				// Active State: Red
				clearBtn.classList.remove('bg-gray-300', 'cursor-not-allowed');
				clearBtn.classList.add('bg-red-600');
				clearBtn.onclick = () => clearAllTracks();
			} else {
				// Inactive State: Grey
				clearBtn.classList.remove('bg-red-600');
				clearBtn.classList.add('bg-gray-300', 'cursor-not-allowed');
				clearBtn.onclick = null; // Disable clicking
			}
		}
		
		photoMarkers.forEach((p, i) => {
			const idx = i;
			const rawAct = (p.activity) ? p.activity.toLowerCase().trim() : '';
			
			// 3. Determine Category and Icon
			const isKnown = ICONS_MAP.hasOwnProperty(rawAct);
			const activityKey = isKnown ? rawAct : 'unknown';
			const displayIcon = isKnown ? ICONS_MAP[rawAct] : '❓';

			// 4. Filter Logic (Year and Activity Type)
			const yearMatch = (activeYear === 'All' || p.year.toString() === activeYear);
			// If it's a known activity, check its filter; always match unknown
			const filterMatch = (activityKey === 'unknown') || activeFilters[activityKey];

			if (yearMatch && filterMatch && p.lat && p.lon) {
				const active = !!loadedTracks[idx];
				
				// --- POPUP BUTTON LOGIC ---
				
				// Album Button Logic
				const hasAlbum = (p.album && p.album.startsWith('http'));
				const albumBtnClass = hasAlbum ? 'bg-indigo-900' : 'bg-gray-300 cursor-not-allowed';
				const albumBtnText = hasAlbum ? '📸 ALBUM' : '🚫 NO ALBUM';
				const albumBtnLink = hasAlbum ? `href="${p.album}" target="_blank"` : 'onclick="return false;"';

				// Track Button Logic
				const hasTrack = (p.gpx && p.gpx.length > 5);
				let trackBtnClass, trackBtnText;

				if (!hasTrack) {
					trackBtnClass = 'bg-gray-300 cursor-not-allowed';
					trackBtnText = '🚫 NO TRACK';
				} else if (active) {
					trackBtnClass = 'bg-gray-500'; // Gray means "Click to hide"
					trackBtnText = '❌ HIDE';
				} else {
					trackBtnClass = 'bg-emerald-700'; // Green means "Click to show"
					trackBtnText = '🗺️ TRACK';
				}

				// Image HTML
				const imgHtml = (p.img && p.img.length > 4) 
					? `<img src="${ASSET_BASE}/${p.year}/img/${p.img}" class="photo-popup-img" onerror="this.style.display='none'">` 
					: '';
				
				// 5. Create the Marker Icon
				const icon = L.divIcon({
					className: `emoji-marker-outer marker-${activityKey.replace('+', '-')}`,
					html: `<span class="emoji-marker-inner">${displayIcon}</span>`,
					iconSize: [26, 26]
				});

				// 6. Build the Popup HTML
				const content = `
					<div class="text-center">
						${imgHtml}
						<div class="popup-title" title="${p.title}">${p.title}</div>
						<div style="font-size: 9px; color: #666; margin-bottom: 8px;">
							${displayIcon} ${p.activity || 'Archived'}
						</div>
						<div class="flex flex-row gap-2 justify-center">
							<a ${albumBtnLink} class="flex-1 p-2 ${albumBtnClass} text-white text-[10px] font-bold rounded text-center">
								${albumBtnText}
							</a>
							<button onclick="${hasTrack ? `loadGpxTrack(${idx})` : ''}" 
									class="flex-1 p-2 ${trackBtnClass} text-white text-[10px] font-bold rounded">
								${trackBtnText}
							</button>
						</div>
					</div>`;

				// 7. Add to Map
				const m = L.marker([p.lat, p.lon], { icon, zIndexOffset: 1000 })
					.bindPopup(content)
					.bindTooltip(p.title, { 
						direction: 'top', 
						offset: [0, -15],
						opacity: 0.9,
						className: 'hover-title' // needs CSS for hover-title
					})
					.addTo(map);
				m._idx = idx;
				currentMarkers.push(m);
				
				// Re-open popup if it was open before the re-render
				if((isInitialLoad && i === 0) || openId === idx) m.openPopup();
			}
		});
		isInitialLoad = false;
	}
	
	/* -------------------------------------------------------------------------
	 * POPULATE YEAR DROP DOWN on the map
	 * Function 
	 --------------------------------------------------------------------------*/		
    function populateYearDropdown() {
        const s = document.getElementById('year-select');
        if (!s) return;
        const yrs = ['All', ...new Set(photoMarkers.map(p => p.year.toString()))].sort().reverse();
        s.innerHTML = '';
        yrs.forEach(y => s.add(new Option(y, y)));
        s.onchange = (e) => { activeYear = e.target.value; renderMarkers(); };
    }

    initDataFetch();
</script>
